version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /console
    schedule:
      interval: weekly
    groups:
      console-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /console/web-app
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: registry.access.redhat.com/ubi9/ubi-minimal
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
