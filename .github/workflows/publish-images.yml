name: Build Docker release candidates

on:
  workflow_dispatch:
    inputs:
      security_release:
        description: Require local security qualification before publication
        type: boolean
        default: false
      increment:
        description: Version increment (first release is 3.0.0)
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: dockerhub-minigo
  cancel-in-progress: false

env:
  IMAGE_NAME: minigostorage/minigo

jobs:
  credentials:
    name: Check publishing credentials and select version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check repository, branch and credentials
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test "$GITHUB_REPOSITORY" = minigo-storage/minigo
          test "$GITHUB_REF" = refs/heads/main
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
      - name: Select the next semantic version
        id: version
        env:
          INCREMENT: ${{ inputs.increment }}
        run: |
          python3 scripts/test-release-version.py
          version=$(python3 scripts/next-release-version.py "$INCREMENT")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Selected release: v$version" >> "$GITHUB_STEP_SUMMARY"
      - name: Authenticate to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  build:
    name: Build and test linux/${{ matrix.arch }}
    needs: credentials
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      MINIGO_ARCHES: ${{ matrix.arch }}
      GOTOOLCHAIN: go1.27.3
      MINIGO_SECURITY_RELEASE: ${{ inputs.security_release }}
      CGO_ENABLED: '0'
      GOFLAGS: -p=4
      GOMAXPROCS: '4'
      MINIO_API_REQUESTS_MAX: '10000'
      MINIGO_VERSION: ${{ needs.credentials.outputs.version }}
      MINIGO_INCREMENT: ${{ inputs.increment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            go.sum
            console/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: console/web-app/package-lock.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build console, binaries and image
        run: make images
      - name: Test console client
        run: npm --prefix console/web-app test
      - name: Test backend and console API
        run: |
          go test -p 4 -tags kqueue,dev -timeout 25m ./cmd ./internal/...
          go test -p 4 -timeout 10m github.com/minio/console/api
      - name: Test image startup and S3 operations
        run: make smoke
      - name: Check source and frontend vulnerabilities
        run: make security
      - name: Test hardened runtime
        run: ./scripts/smoke-hardened.sh
      - name: Check release artifact validation
        run: python3 scripts/test-release-artifacts.py
      - name: Check Helm security configurations
        if: matrix.arch == 'amd64'
        run: |
          helm lint helm/minio
          go test ./tests/helm
      - name: Save the tested image
        run: |
          mkdir -p dist/publish
          python3 - <<'PY'
          import json, os, pathlib
          candidate = {
              "architecture": os.environ["MINIGO_ARCHES"],
              "source_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "version": os.environ["MINIGO_VERSION"],
              "increment": os.environ["MINIGO_INCREMENT"],
              "security_release": os.environ["MINIGO_SECURITY_RELEASE"] == "true",
          }
          pathlib.Path("dist/publish/candidate.json").write_text(json.dumps(candidate, indent=2) + "\n")
          PY
          docker image inspect "minigo:local-$MINIGO_ARCHES" > dist/publish/image.json
          docker save "minigo:local-$MINIGO_ARCHES" | gzip > dist/publish/image.tar.gz
          sha256sum dist/publish/image.tar.gz > dist/publish/image.tar.gz.sha256
      - name: Upload tested image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minigo-image-${{ matrix.arch }}
          path: dist/publish/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Retain security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minigo-security-${{ matrix.arch }}
          path: dist/security/
          retention-days: 30
          if-no-files-found: ignore
